spring.application.name=coffeepilot-api
server.port=${PORT:8080}

# Proxy
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/coffeepilot}
spring.datasource.username=${DB_USERNAME:coffeepilot}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate Limit - IP
rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:3}
rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:120}
rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:100000}
rate-limit.cleanup-interval-ms=60000

# Rate Limit - Login por e-mail
rate-limit.login-failures-per-email=${RATE_LIMIT_LOGIN_FAILURES_PER_EMAIL:10}
rate-limit.login-failures-window=${RATE_LIMIT_LOGIN_FAILURES_WINDOW:15m}

# Rate Limit - Regras personalizadas
rate-limit.rules[0].method=POST
rate-limit.rules[0].path=/v1/orders
rate-limit.rules[0].max=60
rate-limit.rules[0].window=1m

rate-limit.rules[1].path=/v1/products/**
rate-limit.rules[1].max=300
rate-limit.rules[1].window=1m
