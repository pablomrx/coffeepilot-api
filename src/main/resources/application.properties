spring.application.name=coffeepilot-api
server.port=${PORT:8080}

# Conexao com o PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/coffeepilot}
spring.datasource.username=${DB_USERNAME:coffeepilot}
spring.datasource.password=${DB_PASSWORD}

# Configuracoes do JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migracoes do banco de dados
spring.flyway.enabled=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}