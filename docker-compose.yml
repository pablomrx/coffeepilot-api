services:
  postgres:
    image: postgres:17
    container_name: coffeepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffeepilot
      POSTGRES_USER: coffeepilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - coffeepilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeepilot -d coffeepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: coffeepilot-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      # Só na máquina local: nem o SMTP nem a caixa de entrada ficam na rede.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  coffeepilot-postgres-data:
